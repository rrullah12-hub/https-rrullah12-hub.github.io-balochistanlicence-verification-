<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Punjab Licence Verification</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-main: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --color-dark-bg: #0c1214;
      --color-dark-navy: #0e1726;
      --color-gold-accent: #c59b3c;
      --color-btn-green: #16a34a;
      --color-btn-green-hover: #15803d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      position: relative;
      min-width: 320px;
      min-height: 100vh;
      font-family: var(--font-main);
      color: #ffffff;
      background-color: var(--color-dark-bg);
      background-image:
        radial-gradient(circle at 50% 48%, rgba(197, 155, 60, 0.22) 0%, rgba(15, 25, 28, 0.86) 55%, rgba(8, 12, 14, 0.96) 100%),
        linear-gradient(rgba(10, 16, 19, 0.68), rgba(10, 16, 19, 0.78)),
        url("./bg-shield.jpg");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Subtle Tech Grid Overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 90px 90px;
    }

    .bg-emblem {
      position: fixed;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(86vw, 620px);
      height: auto;
      z-index: 0;
      pointer-events: none;
      opacity: 0.28;
    }

    main,
    .menu-btn {
      position: relative;
      z-index: 2;
    }

    button,
    input {
      font-family: var(--font-main);
    }

    button {
      cursor: pointer;
    }

    /* MENU BUTTON */
    .menu-btn {
      position: fixed;
      top: 16px;
      right: 18px;
      z-index: 100;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      border-radius: 8px;
      transition: background .15s ease;
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 998;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      visibility: hidden;
      transition: .25s;
    }

    body.menu-open .menu-overlay {
      opacity: 1;
      visibility: visible;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 999;
      width: min(76vw, 380px);
      height: 100vh;
      padding: 35px 28px;
      background: #111820;
      color: #ffffff;
      border-left: 1px solid rgba(197, 155, 60, 0.25);
      transform: translateX(100%);
      transition: transform .28s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -8px 0 30px rgba(0,0,0,.45);
    }

    body.menu-open .side-menu {
      transform: translateX(0);
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
    }

    .close-menu {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #e2e8f0;
      font-size: 34px;
      font-weight: 700;
    }

    .menu-line {
      height: 1px;
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.12);
    }

    .side-links {
      padding-top: 25px;
    }

    .side-links a {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 15px 12px;
      border-radius: 8px;
      color: #f1f5f9;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      transition: background .15s ease;
      cursor: pointer;
    }

    .side-links a:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-icon {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      color: var(--color-gold-accent);
    }

    .menu-icon svg {
      width: 22px;
      height: 22px;
    }

    /* HOME SECTION */
    .home {
      min-height: 100vh;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .hero {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      text-align: center;
    }

    .hero h1 {
      margin: 0 auto 26px;
      color: #ffffff;
      font-family: var(--font-main);
      font-size: clamp(28px, 4.6vw, 42px);
      line-height: 1.22;
      font-weight: 800;
      letter-spacing: -0.4px;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
    }

    .search {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 62px;
      overflow: hidden;
      border-radius: 7px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .search input {
      width: 100%;
      height: 52px;
      padding: 0 18px;
      border: 0;
      outline: 0;
      background: #ffffff;
      color: #1f2937;
      font-size: 14.5px;
      font-weight: 500;
    }

    .search input::placeholder {
      color: #6b7280;
      font-weight: 400;
    }

    .search button,
    .result-search button {
      height: 52px;
      display: grid;
      place-items: center;
      border: 0;
      background: var(--color-btn-green);
      color: #ffffff;
      transition: background .15s ease, opacity .15s ease;
    }

    .result-search button {
      height: 50px;
    }

    .search button:hover:not(:disabled),
    .result-search button:hover:not(:disabled) {
      background: var(--color-btn-green-hover);
    }

    .search button:disabled,
    .result-search button:disabled {
      opacity: 0.85;
      cursor: wait;
    }

    .search button svg {
      width: 22px;
      height: 22px;
    }

    /* SEARCHING INDICATOR */
    .search-loading {
      display: none;
      max-width: 500px;
      margin: 14px auto 0;
      padding: 10px 14px;
      border-radius: 7px;
      background: rgba(17, 24, 32, 0.92);
      border: 1px solid rgba(197, 155, 60, 0.55);
      color: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .search-loading.show {
      display: flex;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.25);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .features-inline {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 26px;
      margin-top: 22px;
      color: #ffffff;
      font-size: clamp(19px, 3vw, 24px);
      font-weight: 800;
      letter-spacing: -0.2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
    }

    .features-inline span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
    }

    .features-inline span::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .features-bottom {
      width: fit-content;
      margin: 46px auto 0;
      display: grid;
      gap: 18px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #ffffff;
      font-size: clamp(18px, 2.8vw, 22px);
      font-weight: 700;
      letter-spacing: -0.2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
    }

    .feature-text {
      color: #ffffff;
      font-weight: 700;
    }

    .feature-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
    }

    .feature-icon svg {
      width: 30px;
      height: 30px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    .green { color: #22c55e; }
    .red { color: #ef4444; }
    .blue { color: #3b82f6; }

    .search-error {
      display: none;
      max-width: 500px;
      margin: 14px auto 0;
      padding: 10px 14px;
      border-radius: 7px;
      background: rgba(127, 29, 29, 0.9);
      border: 1px solid #f87171;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .search-error.show {
      display: block;
    }

    .login-status {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .login-status.show {
      display: block;
    }

    .login-status.success {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }

    .login-status.error {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
    }

    /* LOGIN & UPLOAD PAGE */
    .login-page {
      display: none;
      min-height: 100vh;
      padding: 40px 20px;
      align-items: center;
      justify-content: center;
    }

    body.login-view .home,
    body.login-view .result-page {
      display: none !important;
    }

    body.login-view .login-page {
      display: flex;
    }

    .login-box {
      width: min(100%, 520px);
      background: rgba(255, 255, 255, 0.97);
      padding: 34px 28px;
      border-radius: 12px;
      border-top: 4px solid var(--color-gold-accent);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .login-box h2 {
      margin: 0 0 22px;
      color: var(--color-dark-navy);
      text-align: center;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .upload-divider {
      margin: 26px 0 18px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .upload-divider h3 {
      margin: 0 0 16px;
      color: var(--color-dark-navy);
      font-size: 19px;
      font-weight: 800;
      text-align: center;
    }

    .login-field {
      margin-bottom: 16px;
    }

    .login-field label {
      display: block;
      margin-bottom: 6px;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
    }

    .login-field input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      font-size: 14.5px;
      transition: border-color .15s ease;
    }

    .login-field input::placeholder {
      color: #94a3b8;
    }

    .login-field input:focus {
      border-color: var(--color-btn-green);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 48px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #64748b;
    }

    .show-password svg {
      width: 20px;
      height: 20px;
    }

    .admin-login-btn {
      width: 100%;
      height: 48px;
      margin-top: 6px;
      border: 0;
      border-radius: 8px;
      background: var(--color-btn-green);
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 700;
      transition: background .15s ease;
    }

    .admin-login-btn:hover:not(:disabled) {
      background: var(--color-btn-green-hover);
    }

    /* RESULT PAGE */
    .result-page {
      display: none;
      width: min(calc(100% - 24px), 620px);
      margin: 72px auto 30px;
      padding-bottom: 40px;
    }

    body.results-view .home,
    body.results-view .login-page {
      display: none !important;
    }

    body.results-view .result-page {
      display: block;
    }

    .result-banner {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    .result-banner.is-missing {
      display: none;
    }

    .result-search {
      display: grid;
      grid-template-columns: 1fr 62px;
      overflow: hidden;
      margin-bottom: 12px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    }

    .result-search input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: 0;
      outline: 0;
      font-size: 15px;
      color: #1f2937;
    }

    .result-search svg {
      width: 22px;
      height: 22px;
    }

    .result-card {
      margin-top: 14px;
      overflow: hidden;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(197, 155, 60, 0.35);
    }

    .result-head {
      padding: 16px;
      background: #111820;
      border-bottom: 3px solid var(--color-gold-accent);
      color: #ffffff;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
    }

    .detail {
      border-bottom: 1px solid #f1f5f9;
    }

    .detail:last-child {
      border-bottom: 0;
    }

    .detail:nth-child(even) {
      background: #f8fafc;
    }

    .detail label,
    .detail strong {
      display: block;
      padding: 11px 18px;
      font-size: 15px;
    }

    .detail label {
      color: #64748b;
      font-weight: 600;
      border-bottom: 1px solid #f1f5f9;
    }

    .detail strong {
      color: #0f172a;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 26px; }
      .features-inline { font-size: 18px; gap: 10px 18px; }
      .features-inline span::before { width: 6px; height: 6px; }
      .feature { font-size: 18px; }
      .features-bottom { margin-top: 38px; gap: 15px; }
      .search input { font-size: 14px; padding: 0 14px; }
      .result-page { margin-top: 68px; }
    }
  </style>
</head>

<body>

<!-- Subtle Shield Watermark Graphic -->
<svg class="bg-emblem" viewBox="0 0 400 420" fill="none" aria-hidden="true">
  <path d="M200 18 L345 72 V195 C345 292 282 365 200 402 C118 365 55 292 55 195 V72 L200 18 Z"
        stroke="#c59b3c" stroke-width="10" fill="rgba(197,155,60,0.06)"/>
  <path d="M200 38 L325 85 V192 C325 277 270 342 200 376 C130 342 75 277 75 192 V85 L200 38 Z"
        stroke="#c59b3c" stroke-width="3" fill="none"/>
  <path d="M12 185 H75 L95 235 H12 V185 Z" stroke="#c59b3c" stroke-width="4" fill="rgba(197,155,60,0.08)"/>
  <path d="M388 185 H325 L305 235 H388 V185 Z" stroke="#c59b3c" stroke-width="4" fill="rgba(197,155,60,0.08)"/>
  <circle cx="200" cy="215" r="88" stroke="#c59b3c" stroke-width="6" fill="rgba(197,155,60,0.08)"/>
  <circle cx="200" cy="215" r="62" stroke="#c59b3c" stroke-width="2.5" fill="none"/>
</svg>

<!-- MENU BUTTON -->
<button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu">
  ☰
</button>

<div class="menu-overlay" id="menuOverlay"></div>

<!-- SIDE MENU -->
<aside class="side-menu" id="sideMenu" aria-label="Navigation Menu">
  <div class="menu-header">
    <strong>Menu</strong>
    <button type="button" class="close-menu" id="closeMenu" aria-label="Close menu">×</button>
  </div>

  <div class="menu-line"></div>

  <nav class="side-links">
    <a href="#home" id="homeLink">
      <span class="menu-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3 2.5 11h2.7v9h5v-5.5h3.6V20h5v-9h2.7L12 3Z"/>
        </svg>
      </span>
      <span>Home</span>
    </a>

    <a href="#login" id="loginLink">
      <span class="menu-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="7" r="4"/>
          <path d="M4.5 21v-2.5c0-4 3.2-6.5 7.5-6.5s7.5 2.5 7.5 6.5V21h-15Z"/>
        </svg>
      </span>
      <span>Login / Upload</span>
    </a>
  </nav>
</aside>

<!-- HOME VIEW -->
<main class="home" id="homePage">
  <section class="hero">
    <h1>
      Welcome to Punjab<br>
      Verification Services
    </h1>

    <!-- SEARCH -->
    <form class="search" id="searchForm" novalidate>
      <input
        id="licenceInput"
        type="text"
        inputmode="text"
        autocomplete="off"
        maxlength="30"
        placeholder="Type DL/CNIC Number Without Dash"
      >
      <button type="submit" id="homeSearchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.5"/>
          <path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <div class="search-loading" id="searchLoading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Searching record, please wait...</span>
    </div>

    <div class="search-error" id="searchError" role="alert" aria-live="polite"></div>

    <div class="features-inline">
      <span>Secure</span>
      <span>Fast</span>
      <span>Reliable</span>
    </div>
  </section>

  <!-- BOTTOM FEATURES -->
  <section class="features-bottom">
    <div class="feature">
      <span class="feature-icon green">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2 4 5v6c0 5.2 3.4 9.7 8 11 4.6-1.3 8-5.8 8-11V5l-8-3Zm0 3.1 5 1.9v4c0 3.8-2.3 7.2-5 8.4V5.1Z"/>
        </svg>
      </span>
      <span class="feature-text">Digital Security</span>
    </div>

    <div class="feature">
      <span class="feature-icon red">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="feature-text">24/7 Available</span>
    </div>

    <div class="feature">
      <span class="feature-icon blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18"/>
          <path d="M12 3c2.3 2.4 3.5 5.4 3.5 9S14.3 18.6 12 21"/>
          <path d="M12 3C9.7 5.4 8.5 8.4 8.5 12s1.2 6.6 3.5 9"/>
        </svg>
      </span>
      <span class="feature-text">Global Access</span>
    </div>
  </section>
</main>

<!-- LOGIN & UPLOAD PAGE VIEW -->
<main class="login-page" id="loginPage">
  <section class="login-box">
    <h2>Admin Portal & Record Upload</h2>

    <form id="adminLoginForm">
      <div class="login-field">
        <label for="adminEmail">Email Address</label>
        <input type="email" id="adminEmail" placeholder="Enter your email" autocomplete="email" required>
      </div>

      <div class="login-field">
        <label for="adminPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="adminPassword" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="show-password" id="showPassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6Z" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="admin-login-btn">Login</button>
      <div class="login-status" id="loginStatus" role="status" aria-live="polite"></div>
    </form>

    <!-- UPLOAD RECORD FORM TO SUPABASE -->
    <div class="upload-divider">
      <h3>Upload New Record to Supabase</h3>
      <form id="uploadRecordForm">
        <div class="login-field">
          <label for="upLicence">Licence Number</label>
          <input type="text" id="upLicence" placeholder="e.g. 1110203937455">
        </div>

        <div class="login-field">
          <label for="upCnic">CNIC Number (Without Dash)</label>

<main class="result-page" id="resultPage">
  <img
    src="./result-banner.jpg"
    class="result-banner"
    id="resultBanner"
    alt="Licence Verification"

    onerror="this.classList.add('is-missing')"
  >

  <form class="result-search" id="resultSearchForm" novalidate>
    <input id="resultInput" type="text" autocomplete="off" maxlength="30" placeholder="Type DL/CNIC Number Without Dash">
    <button type="submit" id="resultSearchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.5"/>
        <path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>

  <div class="search-loading" id="resultSearchLoading" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <span>Searching record, please wait...</span>

  <div class="search-error" id="resultSearchError" role="alert" aria-live="polite"></div>

  <article class="result-card">

      License Number: <span id="licenceNumber"></span>

    </div>

    <div class="detail">
      <label>Name</label>
      <strong id="recordName"></strong>
    </div>

    <div class="detail">
      <label>Father Name</label>
      <strong id="fatherName"></strong>
    </div>

    <div class="detail">
      <label>Date of Birth</label>
      <strong id="dateOfBirth"></strong>
    </div>

    <div class="detail">
      <label>First Issue</label>
      <strong id="firstIssue"></strong>
    </div>

    <div class="detail">
      <label>Issue / Renewal</label>
      <strong id="issueRenewal"></strong>
    </div>

    <div class="detail">
      <label>Validity</label>
      <strong id="validUntil"></strong>

    </div>

      <label>Address</label>
      <strong id="recordAddress"></strong>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = "https://bafxfqxemldrgxeuzlob.supabase.co";
const SUPABASE_KEY = "sb_publishable_YzJLRL3jMxixiKjfT9DdwA_WHCUP1Jd";
const TABLE_NAME = "records";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const menuBtn = document.getElementById("menuBtn");
const closeMenu = document.getElementById("closeMenu");
const menuOverlay = document.getElementById("menuOverlay");
const homeLink = document.getElementById("homeLink");
const loginLink = document.getElementById("loginLink");
const searchForm = document.getElementById("searchForm");
const licenceInput = document.getElementById("licenceInput");
const homeSearchBtn = document.getElementById("homeSearchBtn");
const searchLoading = document.getElementById("searchLoading");
const searchError = document.getElementById("searchError");
const resultSearchForm = document.getElementById("resultSearchForm");
const resultInput = document.getElementById("resultInput");
const resultSearchBtn = document.getElementById("resultSearchBtn");
const resultSearchLoading = document.getElementById("resultSearchLoading");
const resultSearchError = document.getElementById("resultSearchError");
const resultBanner = document.getElementById("resultBanner");
const loginPage = document.getElementById("loginPage");
const adminEmail = document.getElementById("adminEmail");
const adminPassword = document.getElementById("adminPassword");
const showPassword = document.getElementById("showPassword");
const adminLoginForm = document.getElementById("adminLoginForm");
const loginStatus = document.getElementById("loginStatus");
const uploadRecordForm = document.getElementById("uploadRecordForm");
const uploadBtn = document.getElementById("uploadBtn");
const uploadStatus = document.getElementById("uploadStatus");

function stripDashesPreservingCursor(inputEl) {
  const start = inputEl.selectionStart ?? inputEl.value.length;
  const end = inputEl.selectionEnd ?? inputEl.value.length;
  const original = inputEl.value;
  const cleaned = original.replace(/-/g, "");
  if (cleaned === original) return;

  const removedBeforeStart = (original.slice(0, start).match(/-/g) || []).length;
  const removedBeforeEnd = (original.slice(0, end).match(/-/g) || []).length;

  inputEl.value = cleaned;
  inputEl.setSelectionRange(
    Math.max(0, start - removedBeforeStart),
    Math.max(0, end - removedBeforeEnd)
  );
}

licenceInput.addEventListener("input", () => stripDashesPreservingCursor(licenceInput));
resultInput.addEventListener("input", () => stripDashesPreservingCursor(resultInput));

function hideStatusMessages() {
  searchError.classList.remove("show");
  searchError.textContent = "";
  resultSearchError.classList.remove("show");
  resultSearchError.textContent = "";
  searchLoading.classList.remove("show");
  resultSearchLoading.classList.remove("show");
  homeSearchBtn.disabled = false;
  resultSearchBtn.disabled = false;
}

function goToHomeScreen(event) {
  if (event) event.preventDefault();
  document.body.classList.remove("menu-open", "login-view", "results-view");
  hideStatusMessages();
  licenceInput.value = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

menuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  document.body.classList.add("menu-open");
});
closeMenu.addEventListener("click", () => document.body.classList.remove("menu-open"));
menuOverlay.addEventListener("click", () => document.body.classList.remove("menu-open"));

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.body.classList.contains("menu-open")) {
    document.body.classList.remove("menu-open");
  }
});

homeLink.addEventListener("click", goToHomeScreen);

loginLink.addEventListener("click", (event) => {
  event.preventDefault();
  hideStatusMessages();
  document.body.classList.remove("menu-open", "results-view");
  document.body.classList.add("login-view");
  loginStatus.classList.remove("show");
  uploadStatus.classList.remove("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
});

resultBanner.addEventListener("click", goToHomeScreen);

loginPage.addEventListener("click", (event) => {
  if (event.target === loginPage) {
    goToHomeScreen();
  }
});

document.body.addEventListener("click", (event) => {
  if (document.body.classList.contains("results-view") && event.target === document.body) {
    goToHomeScreen();
  }
});

showPassword.addEventListener("click", () => {
  const isHidden = adminPassword.type === "password";
  adminPassword.type = isHidden ? "text" : "password";
  showPassword.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
});

adminLoginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const emailVal = adminEmail.value.trim();
  const passwordVal = adminPassword.value;

  loginStatus.className = "login-status show";
  loginStatus.textContent = "Signing in...";

  const { error } = await supabase.auth.signInWithPassword({
    email: emailVal,
    password: passwordVal
  });

  if (error) {
    loginStatus.className = "login-status show error";
    loginStatus.textContent = "Login failed: " + error.message;
    return;
  }

  loginStatus.className = "login-status show success";
  loginStatus.textContent = "Logged in successfully! You can now upload records.";
});

uploadRecordForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const cleanCnic = cleanNumber(document.getElementById("upCnic").value);
  const cleanLic = cleanNumber(document.getElementById("upLicence").value) || cleanCnic;

  if (!cleanCnic) {
    uploadStatus.className = "login-status show error";
    uploadStatus.textContent = "Please enter CNIC number.";
    return;
  }

  uploadBtn.disabled = true;
  uploadStatus.className = "login-status show";
  uploadStatus.textContent = "Uploading record to Supabase...";

  const newRow = {
    licence: cleanLic,
    cnic: cleanCnic,
    name: document.getElementById("upName").value.trim(),
    father: document.getElementById("upFather").value.trim(),
    date_of_birth: document.getElementById("upDob").value.trim(),
    first_issue: document.getElementById("upFirstIssue").value.trim(),
    issue_renewal: document.getElementById("upIssueRenewal").value.trim(),
    expiry: document.getElementById("upExpiry").value.trim(),
    category: document.getElementById("upCategory").value.trim(),
    address: document.getElementById("upAddress").value.trim()
  };

  const { data, error } = await supabase
    .from(TABLE_NAME)
    .insert([newRow])
    .select();

  uploadBtn.disabled = false;

  if (error) {
    console.error("Supabase Insert Error:", error);
    uploadStatus.className = "login-status show error";
    uploadStatus.textContent = "Upload error: " + error.message;
    return;
  }

  console.log("Inserted into Supabase:", data);
  uploadRecordForm.reset();
  uploadStatus.className = "login-status show success";
  uploadStatus.textContent = "Uploaded to Supabase! CNIC: " + cleanCnic;
});

function cleanNumber(value) {
  return String(value || "").trim().replace(/[\s-]/g, "").toUpperCase();
}

function showError(targetEl, message) {
  targetEl.textContent = message;
  targetEl.classList.add("show");
}

function renderRecord(record, searchedValue) {
  document.getElementById("licenceNumber").textContent = record.licence || record.cnic || "N/A";
  document.getElementById("cnicNumber").textContent = record.cnic || "N/A";
  document.getElementById("recordName").textContent = record.name || "N/A";
  document.getElementById("fatherName").textContent = record.father || "N/A";
  document.getElementById("dateOfBirth").textContent = record.date_of_birth || "N/A";
  document.getElementById("firstIssue").textContent = record.first_issue || "N/A";
  document.getElementById("issueRenewal").textContent = record.issue_renewal || "N/A";
  document.getElementById("validUntil").textContent = record.expiry || "N/A";
  document.getElementById("category").textContent = record.category || "N/A";
  document.getElementById("recordAddress").textContent = record.address || "N/A";

  resultInput.value = cleanNumber(searchedValue) || record.licence || record.cnic || "";

  document.body.classList.remove("login-view", "menu-open");
  document.body.classList.add("results-view");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function fetchRecordFromSupabase(key) {
  const { data, error } = await supabase
    .from(TABLE_NAME)
    .select("*")
    .or(`cnic.ilike.${key},licence.ilike.${key}`)
    .order("id", { ascending: false })
    .limit(1);

  if (error) {
    console.error("Supabase Select Error:", error);
    throw new Error(error.message);
  }

  return data && data.length > 0 ? data[0] : null;
}

async function searchLicence(value, options = {}) {
  const {
    errorTarget = searchError,
    loadingTarget = searchLoading,
    buttonTarget = homeSearchBtn
  } = options;

  const key = cleanNumber(value);
  hideStatusMessages();

  if (!key) {
    showError(errorTarget, "Please enter a licence or CNIC number.");
    return false;
  }

  if (!/^[A-Z0-9]+$/.test(key)) {
    showError(errorTarget, "Only letters and numbers are allowed.");
    return false;
  }

  buttonTarget.disabled = true;
  loadingTarget.classList.add("show");

  try {
    const record = await fetchRecordFromSupabase(key);
    loadingTarget.classList.remove("show");
    buttonTarget.disabled = false;

    if (!record) {
      showError(errorTarget, "Record not found.");
      return false;
    }

    renderRecord(record, key);
    return true;
  } catch (err) {
    loadingTarget.classList.remove("show");
    buttonTarget.disabled = false;
    showError(errorTarget, "Database error: " + err.message);
    return false;
  }
}

searchForm.addEventListener("submit", (event) => {
  event.preventDefault();
  searchLicence(licenceInput.value, {
    errorTarget: searchError,
    loadingTarget: searchLoading,
    buttonTarget: homeSearchBtn
  });
});

resultSearchForm.addEventListener("submit", (event) => {
  event.preventDefault();
  searchLicence(resultInput.value, {
    errorTarget: resultSearchError,
    loadingTarget: resultSearchLoading,
    buttonTarget: resultSearchBtn
  });
});

const urlParams = new URLSearchParams(window.location.search);
const fromUrl = urlParams.get("licence") || urlParams.get("cnic");
if (fromUrl) {
  licenceInput.value = fromUrl.replace(/-/g, "");
  searchLicence(fromUrl, {
    errorTarget: searchError,
    loadingTarget: searchLoading,
    buttonTarget: homeSearchBtn
  });
  history.replaceState(null, "", window.location.pathname);
}
</script>

</body>
